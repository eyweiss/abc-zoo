<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ABC Zoo</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#667eea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ABC Zoo" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { height: 100%; }
      body {
        height: 100%;
        overflow: hidden;
        font-family: 'Nunito', sans-serif;
        background: #667eea;
      }
      #root {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      button { -webkit-tap-highlight-color: transparent; font-family: 'Nunito', sans-serif; }
      button:active { opacity: 0.8; transform: scale(0.97); }
      ::-webkit-scrollbar { display: none; }

      @keyframes slideR { from { opacity:0; transform:translateX(8vw); } to { opacity:1; transform:translateX(0); } }
      @keyframes slideL { from { opacity:0; transform:translateX(-8vw); } to { opacity:1; transform:translateX(0); } }
      @keyframes popIn { from { opacity:0; transform:scale(0.5); } to { opacity:1; transform:scale(1); } }
      @keyframes bounceK { 0%,100% { transform:scale(1); } 50% { transform:scale(1.25); } }
      @keyframes floatUp { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-1.5vw); } }
      @keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-3vw); } 75% { transform:translateX(3vw); } }
      @keyframes confUp { 0% { transform:translateY(0) rotate(0); opacity:1; } 100% { transform:translateY(-60vw) rotate(720deg); opacity:0; } }

      .sr { animation: slideR 0.25s ease; }
      .sl { animation: slideL 0.25s ease; }
      .pi { animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1); }
      .bk { animation: bounceK 0.4s ease; }
      .fl { animation: floatUp 3s ease-in-out infinite; }
      .sh { animation: shake 0.35s ease; }
      .conf { position:fixed; font-size:7vw; animation:confUp 1.5s ease-out forwards; z-index:9999; pointer-events:none; bottom:15%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
